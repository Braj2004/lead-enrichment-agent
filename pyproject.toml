[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-enrichment-agent"
version = "1.0.0"
description = "Autonomous Lead Enrichment Agent using Playwright, LLM Structured Outputs, and External Search Integration."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.42.0",
    "pydantic>=2.6.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "openai>=1.14.0",
    "google-genai>=0.1.0",
    "duckduckgo-search>=5.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.6.0",
    "lxml>=5.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
